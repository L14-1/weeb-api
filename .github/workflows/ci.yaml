name: Pipeline CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  tests:
    name: Run Django TUs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weeb_dev
          POSTGRES_USER: weeb
          POSTGRES_PASSWORD: weeb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weeb -d weeb_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: django-ci-secret-key
      DEBUG: "True"

      POSTGRES_DB: weeb_dev
      POSTGRES_USER: weeb
      POSTGRES_PASSWORD: weeb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEFAULT_FROM_EMAIL: noreply@weeb.fr

      DJANGO_SETTINGS_MODULE: core.settings.development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
